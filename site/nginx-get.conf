# get.andries.icu — sert les scripts du repo /opt/scripts
# Le HTTPS est géré en amont par Nginx Proxy Manager + Cloudflare.
server {
    listen 80 default_server;
    server_name get.andries.icu _;

    root /opt/scripts;
    charset utf-8;
    server_tokens off;

    # Les scripts sont servis en texte brut (lisibles dans le navigateur)
    default_type text/plain;

    add_header X-Content-Type-Options nosniff always;

    # Jamais de fichiers cachés (.git, .github...)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Accueil : texte pour curl/wget, HTML pour un navigateur
    location = / {
        if ($http_user_agent ~* "(curl|wget|httpie|powershell|fetch)") {
            rewrite ^ /_index.txt last;
        }
        rewrite ^ /_index.html last;
    }

    location = /_index.txt {
        internal;
        alias /var/lib/get-site/index.txt;
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /_index.html {
        internal;
        alias /var/lib/get-site/index.html;
        types { }
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # /pve/first-start -> /pve/first-start.sh
    location / {
        types { }
        default_type text/plain;
        try_files $uri $uri.sh =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Healthcheck pour Uptime Kuma
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
